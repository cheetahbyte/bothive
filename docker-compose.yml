services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bothive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bothive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bothive -d bothive"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://bothive:${POSTGRES_PASSWORD}@postgres:5432/bothive
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["node", "dist/worker/main.js"]
    environment:
      DATABASE_URL: postgresql://bothive:${POSTGRES_PASSWORD}@postgres:5432/bothive
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
